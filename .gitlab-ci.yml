workflow:
  rules:
    # Run on merge requests, and on branch / tag pushes. Skip the redundant
    # branch pipeline when an MR is already open for that branch (avoid duplicates).
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH
    - if: $CI_COMMIT_TAG

stages:
- lint
- test
- metrics

# ── Lint ──────────────────────────────────────────────────────────────────────

python-lint:
  stage: lint
  image: python:3.12-slim
  script:
    - pip install -q ruff
    - mkdir -p build/reports
    - ruff check --output-format=junit astroquery/srcnet/ > build/reports/linting.xml || true
    - ruff check astroquery/srcnet/
  artifacts:
    when: always
    reports:
      junit: build/reports/linting.xml
    paths:
      - build/reports/

# ── Test ──────────────────────────────────────────────────────────────────────

python-test:
  stage: test
  image: python:3.12-slim
  script:
    - pip install -q pytest pytest-cov
    - pip install -q -r astroquery/srcnet/tests/requirements.txt
    - pip install -q --no-deps -e .
    - printf 'version = "0.0.0.dev0"\ngithash = ""\nastropy_helpers_version = "unknown"\n' > astroquery/version.py
    - mkdir -p build/reports
    - pytest astroquery/srcnet/tests/
        --junitxml=build/reports/unit-tests.xml
        --cov=astroquery.srcnet
        --cov-report=xml:build/reports/code-coverage.xml
        --cov-report=term-missing
  artifacts:
    when: always
    reports:
      junit: build/reports/unit-tests.xml
      coverage_report:
        coverage_format: cobertura
        path: build/reports/code-coverage.xml
    paths:
      - build/reports/
  coverage: '/TOTAL.*\s+(\d+%)$/'

# ── Metrics ───────────────────────────────────────────────────────────────────

create-ci-metrics:
  stage: metrics
  image: python:3.12-slim
  when: always
  needs:
    - job: python-lint
      optional: true
    - job: python-test
      optional: true
  script:
    - pip install -q anybadge
    - python scripts/create_ci_metrics.py
  artifacts:
    when: always
    paths:
      - build/badges/

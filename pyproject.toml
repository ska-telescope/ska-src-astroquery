[build-system]
requires = ["setuptools>=68", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

# ── Distribution identity ─────────────────────────────────────────────────────
# Distribution name is "ska-src-astroquery" (pip install ska-src-astroquery).
# The importable namespace remains "astroquery.srcnet" so that existing
# notebooks and scripts need no changes:
#   from astroquery.srcnet import DataDiscovery, SoftwareDiscovery, SRCNetChat
# ─────────────────────────────────────────────────────────────────────────────

[project]
name = "ska-src-astroquery"
dynamic = ["version"]
description = "SRCNet astronomy data-access client — astroquery plugin for the SKA SRC Network"
readme = "README.rst"
license = { text = "BSD-3-Clause" }
requires-python = ">=3.10"
keywords = ["astronomy", "ska", "srcnet", "tap", "adql", "astroquery"]
classifiers = [
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: BSD License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Astronomy",
]
dependencies = [
    "astropy>=6.0",
    "pyvo>=1.5",
    "requests>=2.28",
    "anthropic>=0.100",
    "qrcode>=7.4",
    "python-dotenv>=1.0",
    "numpy>=1.24",
    "beautifulsoup4>=4.8",
    "html5lib>=0.999",
    "keyring>=15.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-astropy",
    "pytest-doctestplus>=0.13",
    "ruff",
    "mypy",
]
notebook = [
    "jupyterlab>=4.0",
    "ipython>=8.0",
    "ipywidgets>=8.0",
]
all = [
    "ska-src-astroquery[dev,notebook]",
    "mocpy>=0.9",
    "astropy-healpix",
    "regions",
]

[project.urls]
Source = "https://gitlab.com/ska-telescope/src/ska-src-astroquery"
Documentation = "https://developer.skao.int/projects/ska-src-astroquery"

# ── Package discovery ─────────────────────────────────────────────────────────
# Include astroquery/* so the srcnet plugin lives at astroquery/srcnet/.
# setuptools-scm derives the version from git tags (e.g. v0.2.0 → "0.2.0").

[tool.setuptools.packages.find]
include = ["astroquery*"]

[tool.setuptools_scm]
# fallback when no git tag is reachable (e.g. CI on untagged branch)
fallback_version = "0.0.0.dev0"

# ── Tool config (migrated from setup.cfg) ────────────────────────────────────

[tool.pytest.ini_options]
minversion = "6.0"
testpaths  = ["astroquery", "docs"]
addopts    = "--color=yes"
filterwarnings = [
    "error",
    "ignore:distutils Version classes are deprecated:DeprecationWarning",
    "ignore:unclosed <socket.socket:ResourceWarning",
    "ignore:unclosed <ssl.SSLSocket:ResourceWarning",
    "ignore:numpy.core:DeprecationWarning",
    "ignore::astropy.utils.exceptions.AstropyPendingDeprecationWarning",
    "ignore:The TestRunner:astropy.utils.exceptions.AstropyDeprecationWarning",
]
markers = [
    "bigdata: marks tests that trigger large downloads",
    "noautofixt: disabling fixture autouse",
]

[tool.ruff]
line-length = 120
exclude     = ["_astropy_init.py", "version.py", "astroquery/template_module"]

[tool.ruff.lint]
ignore = ["E226", "E402"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true

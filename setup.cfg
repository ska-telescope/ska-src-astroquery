# Superseded by pyproject.toml — kept only for tools that still read setup.cfg
# (e.g. older pip versions, some IDE integrations).
# All metadata, dependencies, and tool configuration now live in pyproject.toml.

[tool:pytest]
# Retain legacy pytest section for backward compat with older pytest-astropy
minversion = 6.0
testpaths  = astroquery docs
addopts    = --color=yes
filterwarnings =
    error
    ignore:distutils Version classes are deprecated:DeprecationWarning
    ignore:unclosed <socket.socket:ResourceWarning
    ignore:unclosed <ssl.SSLSocket:ResourceWarning
    ignore:numpy.core:DeprecationWarning

[flake8]
max-line-length = 120
ignore = E226,E402,W503
exclude = _astropy_init.py,version.py,astroquery/template_module
